name: Build FielDex cards

# Regenerates cards and the browser fallback whenever source data changes.

on:
  push:
    paths:
      - "fieldex.json"
      - "fieldex_core.py"
      - "build_data_js.py"
      - "generate_card.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldex-card-build
  cancel-in-progress: false

jobs:
  build-cards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source data
        run: python -m unittest discover -s tests -v

      - name: Build browser fallback
        run: python build_data_js.py

      - name: Generate all cards
        run: python generate_card.py --all

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/ fieldex-data.js
          git diff --staged --quiet || git commit -m "Rebuild FielDex cards"
          git push
